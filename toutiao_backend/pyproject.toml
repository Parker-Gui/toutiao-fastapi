[project]
name = "toutiao-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "fastapi>=0.162.7",
    "pwdlib[bcrypt]>=0.4.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]


[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 Depends/Query/Body 等本身就是靠"参数默认值里的调用"来声明依赖的，
# 属于 B008（函数调用出现在参数默认值中）的合理例外，这里加入白名单避免误报
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]
